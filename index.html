<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Pengumuman Kelulusan 2026
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>
<body>

<div class="glow"></div>
<div class="glow"></div>

<div class="card">

  <img
    src="assets/logo.png"
    class="logo"
  >

  <h1>
    MTSS MURSYIDUL FALAH
  </h1>

  <div class="yayasan">
    Yayasan Pesantren Islam
    Mursyidul Falah
  </div>

  <div class="alamat">
    Dusun Karajan Desa Kampungsawah<br>
    Kec. Jayakerta Kab. Karawang Jawa Barat
  </div>

  <div class="countdown-title">
    Pengumuman Kelulusan
  </div>

  <div id="countdown">
    Loading...
  </div>

 <div class="info" id="infoText">
  Pengumuman akan dibuka pada<br>
  02 Juni 2026 Jam 10.00 WIB
</div>

<div
  id="loginBox"
  style="display:none;"
>

  <input
    type="text"
    id="nisn"
    placeholder="Masukkan NISN"
  >

  <input
    type="text"
    id="tanggal"
    placeholder="Tanggal Lahir (02-06-2010)"
  >

  <div class="captcha-area">

    <div id="captchaText"></div>

    <input
      type="text"
      id="captchaInput"
      placeholder="Jawaban Captcha"
    >

  </div>

  <button onclick="cekKelulusan()">
    CEK KELULUSAN
  </button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
